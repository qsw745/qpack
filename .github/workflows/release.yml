name: Release QPack (macOS & Windows + SignPath)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布版本号（例如 v0.1.3）"
        required: true
        default: "v0.1.3"
      release_notes:
        description: "本次版本更新说明"
        required: false
        default: "QPack 新版本发布"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (NSIS + MSI + SignPath)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installers (NSIS & MSI)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis,msi

      - name: Prepare artifacts directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" dist-windows/ -ErrorAction SilentlyContinue
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe.sig" dist-windows/ -ErrorAction SilentlyContinue
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" dist-windows/ -ErrorAction SilentlyContinue
          Get-ChildItem dist-windows/

      - name: Pack unsigned Windows installers for SignPath
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          Compress-Archive -Path "dist-windows/*.exe","dist-windows/*.msi" -DestinationPath "unsigned-windows.zip" -Force

      - name: Sign Windows installers via SignPath Foundation
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'qpack' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ""
          input-artifact-path: "unsigned-windows.zip"
          output-artifact-path: "signed-windows.zip"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 600

      - name: Replace with SignPath signed binaries and re-sign Tauri updater sig
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          Expand-Archive -Path "signed-windows.zip" -DestinationPath "dist-windows" -Force
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Get-ChildItem "dist-windows/*-setup.exe" | ForEach-Object {
              pnpm tauri signer sign $_.FullName
            }
          }
          Get-ChildItem dist-windows/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist-windows/*

  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_label: aarch64
          - target: x86_64-apple-darwin
            arch_label: x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS DMG & updater bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg,app

      - name: Collect macOS artifacts
        run: |
          mkdir -p dist-macos-${{ matrix.arch_label }}
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist-macos-${{ matrix.arch_label }}/ || true
          if [ -f "src-tauri/target/${{ matrix.target }}/release/bundle/macos/QPack.app.tar.gz" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/QPack.app.tar.gz \
               dist-macos-${{ matrix.arch_label }}/QPack_${{ matrix.arch_label }}.app.tar.gz
          fi
          if [ -f "src-tauri/target/${{ matrix.target }}/release/bundle/macos/QPack.app.tar.gz.sig" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/QPack.app.tar.gz.sig \
               dist-macos-${{ matrix.arch_label }}/QPack_${{ matrix.arch_label }}.app.tar.gz.sig
          fi
          ls -lh dist-macos-${{ matrix.arch_label }}/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch_label }}-artifacts
          path: dist-macos-${{ matrix.arch_label }}/*

  publish-release:
    name: Publish GitHub Release & latest.json
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate latest.json for Tauri Updater
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || 'QPack 正式版本发布' }}
          REPO: ${{ github.repository }}
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");

          const tag = process.env.TAG_NAME;
          const version = tag.replace(/^v/, "");
          const notes = process.env.RELEASE_NOTES;
          const baseUrl = `https://github.com/${process.env.REPO}/releases/download/${tag}`;
          const dir = "release-assets";
          const files = fs.readdirSync(dir);

          const platforms = {};
          const findFile = (regex) => files.find((f) => regex.test(f));

          const winExe = findFile(/-setup\.exe$/);
          if (winExe && fs.existsSync(path.join(dir, `${winExe}.sig`))) {
            platforms["windows-x86_64"] = {
              signature: fs.readFileSync(path.join(dir, `${winExe}.sig`), "utf8").trim(),
              url: `${baseUrl}/${winExe}`,
            };
          }

          const macArm = findFile(/aarch64\.app\.tar\.gz$/);
          if (macArm && fs.existsSync(path.join(dir, `${macArm}.sig`))) {
            platforms["darwin-aarch64"] = {
              signature: fs.readFileSync(path.join(dir, `${macArm}.sig`), "utf8").trim(),
              url: `${baseUrl}/${macArm}`,
            };
          }

          const macX64 = findFile(/x64\.app\.tar\.gz$/);
          if (macX64 && fs.existsSync(path.join(dir, `${macX64}.sig`))) {
            platforms["darwin-x86_64"] = {
              signature: fs.readFileSync(path.join(dir, `${macX64}.sig`), "utf8").trim(),
              url: `${baseUrl}/${macX64}`,
            };
          }

          const latest = {
            version,
            notes,
            pub_date: new Date().toISOString(),
            platforms,
          };

          fs.writeFileSync(path.join(dir, "latest.json"), JSON.stringify(latest, null, 2) + "\n");
          console.log(JSON.stringify(latest, null, 2));
          EOF

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: QPack ${{ github.event.inputs.tag_name || github.ref_name }}
          body: ${{ github.event.inputs.release_notes || 'QPack 跨平台正式版本发布（Windows 安装包经 SignPath Foundation 免费开源代码签名）' }}
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.msi
            release-assets/*.tar.gz
            release-assets/latest.json
