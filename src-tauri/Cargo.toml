[package]
name = "qpack"
version = "0.1.2"
description = "QPack - 极简、高性能、跨平台解压缩工具"
authors = ["QPack"]
edition = "2021"

[lib]
name = "qpack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
thiserror = "2"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# 核心压缩与解压引擎（Rust 原生）
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd", "aes-crypto", "time"] }
flate2 = "1"
tar = "0.4"
zstd = "0.13"
bzip2 = "0.5"
xz2 = "0.1"
sevenz-rust = "0.6"

# 编码检测与转换（防跨平台中文乱码）
encoding_rs = "0.8"
chardetng = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
